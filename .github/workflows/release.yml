name: Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.7.4)
        required: true
        default: v0.7.4
        type: string

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.repository }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate release tag
        id: tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          VALIDATE_BRANCH: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
        run: |
          if ($env:VALIDATE_BRANCH -eq 'true') {
            $env:RELEASE_TAG = 'v' + (python -c 'from steam_sda import __version__; print(__version__)')
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read branch version' }
          }
          if ($env:RELEASE_TAG -cnotmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw 'Expected a release tag in the form v0.7.4'
          }
          "tag=$env:RELEASE_TAG" >> $env:GITHUB_OUTPUT

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Check application version and release notes
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $version = python -c 'from steam_sda import __version__; print(__version__)'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read application version' }
          if ($env:RELEASE_TAG -cne "v$version") { throw 'Tag and application version differ' }
          if (-not (Test-Path -LiteralPath ".github/releases/$env:RELEASE_TAG.md")) {
            throw 'Release notes are missing'
          }
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the release commit' }
          "sha=$sha" >> $env:GITHUB_OUTPUT

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Check architecture boundaries
        run: python -m unittest discover -s tests -p test_architecture.py -v

      - name: Build native helper, SteamKit and desktop app
        run: python tools/build.py

      - name: Run tests with synthetic accounts
        run: python -m unittest discover -s tests -v

      - name: Render interface previews with synthetic accounts
        run: python tools/render_preview.py

      - name: Verify the packaged app and SteamKit helper
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'dist/SteamSDA/SteamSDA.exe'
          $process = Start-Process -FilePath $exe -ArgumentList '--check-ui','build/release-ui-check.json' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Packaged app check failed' }
          $report = Get-Content -LiteralPath 'build/release-ui-check.json' -Raw | ConvertFrom-Json
          if (-not $report.ok -or -not $report.steamkit.ok) { throw 'UI or SteamKit check failed' }
          if ("v$($report.app_version)" -cne $env:RELEASE_TAG) { throw 'Packaged app version does not match the release tag' }
          Get-Content -LiteralPath 'build/release-ui-check.json'

      - name: Package ZIP and SHA-256
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python tools/package_release.py --tag $env:RELEASE_TAG

      - name: Verify the extracted ZIP outside the checkout
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python tools/verify_distribution.py --archive "build/release/SteamSwitcher-${env:RELEASE_TAG}-win-x64.zip"

      - name: Build Windows installer and checksums
        run: python tools/build_installer.py

      - name: Verify installation, automatic path detection and uninstall
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: python tools/verify_installer.py --installer "build/release/SteamSwitcher-${env:RELEASE_TAG}-Setup-x64.exe"

      - name: Save release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: |
            build/release/*.zip
            build/release/*-Setup-x64.exe
            build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Save installer verification report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-verification
          path: build/installer-check.json
          if-no-files-found: error
          retention-days: 7

      - name: Save interface previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: interface-previews
          path: build/previews/*.png
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false

      - name: Download checked release files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: windows-release
          path: release-files

      - name: Publish ZIP and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          notes=".github/releases/${RELEASE_TAG}.md"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/*.zip release-files/*-Setup-x64.exe release-files/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release-files/*.zip release-files/*-Setup-x64.exe release-files/SHA256SUMS.txt \
              --verify-tag --title "Steam Switcher ${RELEASE_TAG}" --notes-file "$notes" --latest
          fi

      - name: Verify the published updater feed and installer download
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/update-feed-check"
          "$RUNNER_TEMP/update-feed-check/bin/python" -m pip install requests==2.34.2
          "$RUNNER_TEMP/update-feed-check/bin/python" tools/verify_update_feed.py --previous 0.7.3
